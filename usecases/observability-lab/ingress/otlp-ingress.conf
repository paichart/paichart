# OTLP/http ingress allowlist — the lab's enforcement point for "which senders may export telemetry".
# nginx evaluates allow/deny IN ORDER, first match wins. Read-only to the harvest service
# (obs-mcp get_ingress_config); changed only by an operator applying an approved change package,
# then `docker exec obs-ingress nginx -s reload`.
#
# BASELINE (brownfield): no sender restriction yet — `allow all`. Authorising a specific sender set
# means inserting its allow lines ABOVE `allow all` and replacing `allow all` with `deny all`.

server {
    listen 4318;
    client_max_body_size 16m;          # OTLP batches; nginx's 1m default would 413 real exporters

    location / {
        # Operator access: the rig HOST reaches this container from the pinned network's gateway
        # (docker-compose.yml `networks.default`), not from 127.0.0.1. Keeps the demo curl working
        # under any future deny-all.
        allow 172.20.0.1;

        allow all;

        proxy_pass http://otel-collector:4318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
