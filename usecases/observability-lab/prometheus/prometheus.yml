# Brownfield baseline — the "customer's existing" Prometheus config the harvester reads.
# Deliberately realistic: self-monitoring + the OTel collector's own metrics + its exported pipeline.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { tier: platform }

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels: { tier: platform }

  - job_name: otel-collector
    # the collector's OWN telemetry (service.telemetry metrics endpoint)
    static_configs:
      - targets: ["otel-collector:8888"]
        labels: { tier: platform }

  - job_name: otel-exported
    # metrics the collector EXPORTS via its prometheus exporter (the OTLP pipeline's output)
    static_configs:
      - targets: ["otel-collector:8889"]
        labels: { tier: pipeline }
