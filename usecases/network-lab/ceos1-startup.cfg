! Phase-4 cEOS startup-config — ceos1
! Enables eAPI on the management interface for read-only NAPALM/pyeapi harvest, plus a little
! realistic L3/BGP/SNMP state so 'show running-config' has substance for the pipeline to design against.
!
! NOTE: Management0 is intentionally NOT configured here — containerlab assigns the mgmt IP
! (172.30.30.11, from topology.clab.yml `mgmt-ipv4`) to Management0 automatically for arista_ceos.
! Adding an explicit `interface Management0 ip address ...` here can conflict with that injection.
!
hostname ceos1
!
! Lab credentials — STATIC. This is the honest WS4 non-conformance: the device is reached with a
! static service credential, NOT the JWKS-forwarded per-user identity WS4 R2a mandates.
username admin privilege 15 role network-admin secret 0 paichartlab
!
! eAPI: enable on the default VRF (Management0 lives there) over HTTP (pyeapi/NAPALM-eos talk to it).
! HTTPS is also enabled so the inventory can use either transport; the nornir inventory pins http.
management api http-commands
   no shutdown
   protocol http
   protocol https
   !
   vrf default
      no shutdown
!
ip routing
!
! Data interface toward ceos2 (eth1 == Ethernet1).
interface Ethernet1
   description to-ceos2
   no switchport
   ip address 10.0.12.1/30
!
! FW-A3.2 security-policy ports (2026-08-21) — bindable interfaces for the firewall use-case legs.
! Roles are carried by DESCRIPTIONS (harvest-visible); no L3 addressing needed for ACL binding.
interface Ethernet2
   description DMZ-SEGMENT (dmz zone) — toward dmz-sg cloud segment
   no switchport
interface Ethernet3
   description PARTNER-UPLINK (untrust zone) — partner-internet ingress
   no switchport
!
!
! ---------------------------------------------------------------------------
! Telemetry-exporter pool (10.99.0.0/24) — PRE-EXISTING, SCATTERED ALLOCATIONS.
!
! ⚠️ DO NOT "TIDY" THESE. The scatter is load-bearing test data, not cruft.
!
! T6 (the sequenced-program validation round) requires a runtime interdependency:
! the network design must SELECT a free exporter /32 per switch and DERIVE the
! smallest aggregate covering both — and the terraform leg downstream allowlists
! THAT aggregate in the telemetry-archive bucket policy.
!
! The scatter is what makes the selection a genuine computation over HARVESTED
! state rather than a guessable "next free". Two INVARIANTS hold for whatever
! addresses appear below (enforced by randomize-t6-seed.py, which generates them):
!   (1) the naive lowest-free pick MUST summarize into an aggregate that covers a
!       taken address -> an authz widening the design must reject. Without this the
!       dependency degenerates into a guessable lookup.
!   (2) at least one CLEAN pair MUST exist -> otherwise the correct outcome is
!       "escalate", which cannot validate T6's happy path.
! Addresses are unique FABRIC-WIDE (advertised /32s — a duplicate is a real BGP
! conflict). The concrete values are deliberately NOT restated in this comment:
! they change on every rebuild, and a comment that pins them would go stale the
! first time the seed is re-randomized. Read them from the stanzas below.
!
! Re-randomize on rig rebuild (`python3 randomize-t6-seed.py --write`) — T6's whole
! premise is that the answer CHANGES per build, so it can never be pinned into a
! static design artifact or an interface contract.
! See: cline_docs/reviews/program-architect-design-2026-07-15/PROGRAM-TEST-PLAN.md (T6)
! ---------------------------------------------------------------------------
interface Loopback11
   description telemetry-exporter (existing allocation)
   ip address 10.99.0.1/32
!
interface Loopback12
   description telemetry-exporter (existing allocation)
   ip address 10.99.0.26/32
!
interface Loopback13
   description telemetry-exporter (existing allocation)
   ip address 10.99.0.29/32
!
! eBGP toward ceos2 — gives get_bgp_neighbors / get_bgp_config real output to harvest.
router bgp 65001
   router-id 1.1.1.1
   neighbor 10.0.12.2 remote-as 65002
   neighbor 10.0.12.2 description to-ceos2
   !
   ! Existing exporter /32s are advertised — so a harvest of BGP state (not just
   ! interface state) also shows the allocations.
   network 10.99.0.1/32
   network 10.99.0.26/32
   network 10.99.0.29/32
   !
   address-family ipv4
      neighbor 10.0.12.2 activate
!
! Deliberate redaction bait (lab-only FAKE secret): a real secret-shaped directive in 'show run'
! so the R9 sanitizer / R10 backstop have something to exercise on genuine EOS output.
snmp-server community s3cr3tLabComm1 ro
!
end
