! Phase-4 cEOS startup-config — ceos2  (mirror of ceos1; see ceos1-startup.cfg for the full notes)
! Management0 is assigned by containerlab (172.30.30.12) — do NOT configure it here.
!
hostname ceos2
!
username admin privilege 15 role network-admin secret 0 paichartlab
!
management api http-commands
   no shutdown
   protocol http
   protocol https
   !
   vrf default
      no shutdown
!
ip routing
!
interface Ethernet1
   description to-ceos1
   no switchport
   ip address 10.0.12.2/30
!
! FW-A3.2 security-policy ports (2026-08-21) — bindable interfaces for the firewall use-case legs.
interface Ethernet2
   description DMZ-SEGMENT (dmz zone) — toward dmz-sg cloud segment
   no switchport
interface Ethernet3
   description INSIDE-APP (inside zone) — toward internal-app 10.20.0.10
   no switchport
!
!
! ---------------------------------------------------------------------------
! Telemetry-exporter pool (10.99.0.0/24) — PRE-EXISTING, SCATTERED ALLOCATIONS.
! ⚠️ DO NOT "TIDY" THESE — load-bearing T6 test data (see ceos1-startup.cfg for
! the full rationale + the two invariants the scatter must satisfy).
! Addresses are unique across the fabric because they are advertised /32s; the
! concrete values are NOT restated here (they change per rebuild — read them from
! the stanzas below). Re-randomize on rig rebuild:
!   python3 randomize-t6-seed.py --write
! ---------------------------------------------------------------------------
interface Loopback11
   description telemetry-exporter (existing allocation)
   ip address 10.99.0.2/32
!
interface Loopback12
   description telemetry-exporter (existing allocation)
   ip address 10.99.0.4/32
!
interface Loopback13
   description telemetry-exporter (existing allocation)
   ip address 10.99.0.24/32
!
router bgp 65002
   router-id 2.2.2.2
   neighbor 10.0.12.1 remote-as 65001
   neighbor 10.0.12.1 description to-ceos1
   !
   network 10.99.0.2/32
   network 10.99.0.4/32
   network 10.99.0.24/32
   !
   address-family ipv4
      neighbor 10.0.12.1 activate
!
! Deliberate redaction bait (lab-only FAKE secret).
snmp-server community s3cr3tLabComm2 ro
!
end
