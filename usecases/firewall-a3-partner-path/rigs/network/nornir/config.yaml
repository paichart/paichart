---
# Nornir loader config consumed by sydasif/nornir-mcp-server.
# Verified format (repo README, 2026-06-25): SimpleInventory over hosts/groups/defaults.
inventory:
  plugin: SimpleInventory
  options:
    host_file: "hosts.yaml"
    group_file: "groups.yaml"
    defaults_file: "defaults.yaml"
runner:
  plugin: threaded
  options:
    num_workers: 5
