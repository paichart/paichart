# Sample workloads to give the harvest real state. DELIBERATELY missing an HPA + resource
# limits on the `orders-api` Deployment — that gap is the target for the demo objective
# ("add an HPA + CPU/memory requests/limits"). Apply: kubectl apply -f sample-workloads.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: trading
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: trading
  labels: { app: orders-api, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api, tier: backend }
    spec:
      containers:
        - name: orders-api
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          # NB: no resources.requests/limits set — the target gap for the demo change.
          env:
            - name: ORDERS_FEED_URL
              value: "http://market-data.trading.svc.cluster.local:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: trading
spec:
  selector: { app: orders-api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-config
  namespace: trading
data:
  LOG_LEVEL: "info"
  FEED_TIMEOUT_MS: "2500"
  # a connection-string-shaped value to exercise the R10 redaction families later (it's config, not a Secret)
  METRICS_DSN: "postgres://metrics:hunter2@metrics-db.trading.svc:5432/orders"
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-api-creds
  namespace: trading
type: Opaque
stringData:
  # list_secret_names must surface name + key NAMES ("api-token","db-password") but NEVER these values
  api-token: "s3cr3t-rig-token-do-not-leak"
  db-password: "rig-pw-do-not-leak"
