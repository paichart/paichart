# gitleaks config — working-tree + staged-diff secret scanning.
#
# WHY: 2026-09-03 full-history audit (gitleaks 8.30.1, 4,956 commits) found real
# credentials had entered the repo through FOUR channels: a committed
# .env.production (2025-09), hardcoded values in ecosystem.config.js and
# hub-tools-handler.js (2025-07..09), committed debug artifacts (cookies.txt),
# and — the recurring one — live values pasted into session notes / knowledge
# docs. The first three are config gaps; the fourth is a habit, so it needs a
# tripwire at commit time, not a .gitignore line.
#
# SCOPE: this config is used by `gitleaks dir .` (working tree) in CI and
# `gitleaks git --staged` in .githooks/pre-commit. It is NOT run over history —
# history is known-dirty and stays private; the public repo is a fresh-history
# export (see cline_docs/reviews/open-source-readiness-2026-09-03/).
#
# ALLOWLIST RULE: every entry below is a value that was individually inspected
# and is provably not a credential. Add to it only with the same evidence; a
# new "false positive" you cannot explain is a finding, not noise.

[extend]
useDefault = true

[allowlist]
description = "Inspected non-secrets (2026-09-03 audit)"
regexes = [
  '''AKIA1234567890ABCD99''',                 # LocalStack rig fixture — the R10 redaction test's deliberately secret-shaped tag
  '''eyJhbGciOiJub25lIn0\.[A-Za-z0-9_-]+\.''', # alg=none JWT — negative security-test input
  '''8kLm3PqR5tUvWx2Y''',                     # SECURITY-REMEDIATION-GUIDE example password, stated as example in-text
  '''admin:paichartlab''',                     # cEOS lab-rig default creds (private docker network, non-routable)
  '''sk-1234567890abcdef''',                   # placeholder in rotation-plan prose
  '''eyJvZmZzZXQiOjEwMH0=''',                  # base64 pagination cursor {"offset":100}
  '''<REDACTED-[A-Z-]+>''',                    # our own redaction markers
  # Truncated doc snippets: a value ending in "..." is a display fragment, not a
  # credential (e.g. `eyJhbGciOiJIUzI1NiIs...` in curl examples). A full token
  # never ends in three dots.
  '''^\S+\.\.\.$''',
  # Placeholder tokens in curl examples across cline_docs/docs/knowledge.
  '''(?i)^(your_|\$?your|admin_token|user_token|demo_user|demo_token|invalid|jwt_token|\$jwt|\$token)''',
  # test-security-invariants.ts synthetic "eyJ.<b64>.sig" fixtures (3 dot-separated stubs < 20 chars)
  '''^eyJ\.[A-Za-z0-9]{1,12}\.[A-Za-z0-9]{1,4}$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJleHAiOjE2MDAwMDAwMDB9\.''', # security-testing-guide fixture: {"alg":"HS256"}.{"exp":1600000000} (expired 2020, unsigned stub)
  '''^c[a-z0-9]{24}$''',                     # CUID row ids (user/task ids in log excerpts) — identifiers, not credentials
  '''^orders-api-[a-z0-9]{8,10}-[a-z0-9]{5}$''', # k8s lab pod names (Deployment-generated ReplicaSet+pod hashes) in exported run artifacts — identifiers, not credentials (inspected 2026-09-24)
  '''^BGP/OSPF/''',                           # prose fragment in a review doc
  # A PEM BEGIN marker written AS PROSE in markdown (review docs discussing the R10 PEM rule, 2026-10-13):
  # the BEGIN line continues into text containing a backtick. A real key's BEGIN line ends at the
  # closing dashes and the next line is base64, which never contains a backtick (inspected: 5 matches in
  # REVIEW-P1-P2.md / REVIEW-P1-P2-PATTERNS.md, none with a key body).
  '''-----BEGIN[ A-Z0-9_-]*PRIVATE KEY(?: BLOCK)?-----[^\n]*`''',
  '''^abc123def456$''',
  '''^0123456789abcdef0123456789abcdef$''',     # synthetic Datadog-shaped key in the R10 v3 golden corpus (test-security-invariants.ts): two runs of 0-f counting, not a credential (inspected 2026-10-14)
  '''^0123456789abcdefSynth3tic0123456$''',     # synthetic Datadog-shaped key in the R10 v3 must-redact fixtures: counting + "Synth3tic", not a credential (inspected 2026-10-14)
  '''^Synth3ticLEAK9$''',                       # synthetic planted value in scripts/replay-r10-versions.ts --self-test (the test asserts it is never PRINTED); invented, not a credential (inspected 2026-10-14)
  '''^Synth3ticTok9$''',                        # synthetic value in the Stage B sec-ops delta re-score (example of a block-context secret an edit could add); named "Synth3tic", invented for the review, not a credential (inspected 2026-10-14)                        # synthetic R10 test value in the Stage B sec-ops review (a proposed pin: "an edit body api_key: <this> refuses"); counting digits + hex letters, not a credential (inspected 2026-10-14)
  # R10 v4 (R10-CODE-ASSIGN) must-redact fixtures in scripts/test-security-invariants.ts: invented values named "Synth3tic", shaped
  # like a GitHub PAT / AWS key id so the := literal rule and its config siblings are exercised; not credentials (inspected 2026-10-19).
  '''^ghp_Synth3tic9$''',
  '''^ghp_Synth3ticSynth3tic9999$''',
  '''^ghp_Synth3ticSynth3tic9999abc$''',
  '''^ghp_Synth3ticSynth3ticSynth3tic9999$''',
  '''^AKIAABCDEF1234567890$''',
  # R10 v5 (sec-ops R10v5 B-1 / (a)) probe values in test-security-invariants.ts + REVIEW-sec-ops-R10v5.md: invented human-style
  # passwords shaped like an HCL expression, used to prove the expression exemption is case-sensitive / to name a residual; not credentials (inspected 2026-10-19).
  '''^Count\.Dracula1$''',
  '''^var\.Hunter2x9$''',
  # L-K2 (held-k8s step 3 lab) canary plant in LAB-PREREG-L-K2.md + its experiment: an invented value named "LK2CANARY", planted to prove
  # R10 redacts it at capture and it never reaches an agent prompt; not a credential (inspected 2026-10-19).
  '''^LK2CANARYw8Rq4Zt1Xm6$''',
]
paths = [
  '''node_modules''',
  '''package-lock\.json''',
  '''\.next/''',
]
