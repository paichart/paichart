# Secret scan — 2026-09-03 (open-source readiness, step 3)
#
# WHY THIS EXISTS: a full-history gitleaks audit found credentials had entered
# this repo four separate ways, and the recurring channel was live values
# pasted into docs/session notes — which no .gitignore catches. The pre-commit
# hook (.githooks/pre-commit, check 5) is the primary guard; this is the
# backstop for `--no-verify` commits and for machines without the hook active.
#
# SCOPE: scans the WORKING TREE at the pushed ref (`gitleaks dir`), not git
# history. History is known-dirty and is not being rewritten (fresh-history
# export is the open-source path). Allowlist lives in .gitleaks.toml.
#
# No paths filter on purpose — a secret can land in any file type.
name: Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:

# Least privilege (fork-safe): nothing here writes to the repo.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan working tree
        run: /tmp/gitleaks dir . --config .gitleaks.toml --redact=80 --no-banner --exit-code 1
