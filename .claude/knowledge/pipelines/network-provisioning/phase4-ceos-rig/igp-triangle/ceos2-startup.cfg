! IGP-migration rig startup-config — ceos2 (transit node of the triangle; see ceos1-startup.cfg
! for the full rationale notes). Management0 is assigned by containerlab (172.30.31.12).
!
hostname ceos2
!
username admin privilege 15 role network-admin secret 0 paichartlab
!
management api http-commands
   no shutdown
   protocol http
   protocol https
   !
   vrf default
      no shutdown
!
ip routing
!
interface Loopback0
   description router-id / migration anchor
   ip address 2.2.2.2/32
!
interface Ethernet1
   description to-ceos1 (ospf cost 10)
   no switchport
   ip address 10.0.12.2/30
   ip ospf network point-to-point
   ip ospf cost 10
!
interface Ethernet2
   description to-ceos3 (ospf cost 20)
   no switchport
   ip address 10.0.23.1/30
   ip ospf network point-to-point
   ip ospf cost 20
!
router ospf 1
   router-id 2.2.2.2
   passive-interface Loopback0
   network 2.2.2.2/32 area 0.0.0.0
   network 10.0.12.0/30 area 0.0.0.0
   network 10.0.23.0/30 area 0.0.0.0
   max-lsa 12000
!
! Deliberate redaction bait (lab-only FAKE secret).
snmp-server community s3cr3tLabComm2 ro
!
end
