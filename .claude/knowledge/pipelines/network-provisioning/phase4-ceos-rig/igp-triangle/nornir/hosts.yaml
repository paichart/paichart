---
# The three IGP-triangle cEOS nodes, addressed by their containerlab mgmt IPs
# (igp-triangle/topology.clab.yml `mgmt-ipv4`, bridge clab-igp 172.30.31.0/24).
# nornir-mcp runs on the prod HOST attached to clab-igp, reaching this subnet directly.
ceos1:
  hostname: 172.30.31.11
  platform: eos
  groups:
    - arista_eos
ceos2:
  hostname: 172.30.31.12
  platform: eos
  groups:
    - arista_eos
ceos3:
  hostname: 172.30.31.13
  platform: eos
  groups:
    - arista_eos
