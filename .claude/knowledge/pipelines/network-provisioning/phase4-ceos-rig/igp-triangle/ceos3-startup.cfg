! IGP-migration rig startup-config — ceos3 (third node of the triangle; see ceos1-startup.cfg
! for the full rationale notes). Management0 is assigned by containerlab (172.30.31.13).
!
hostname ceos3
!
username admin privilege 15 role network-admin secret 0 paichartlab
!
management api http-commands
   no shutdown
   protocol http
   protocol https
   !
   vrf default
      no shutdown
!
ip routing
!
interface Loopback0
   description router-id / migration anchor
   ip address 3.3.3.3/32
!
interface Ethernet1
   description to-ceos2 (ospf cost 20)
   no switchport
   ip address 10.0.23.2/30
   ip ospf network point-to-point
   ip ospf cost 20
!
interface Ethernet2
   description to-ceos1 (ospf cost 40 — transit path via ceos2 preferred: 20+10=30)
   no switchport
   ip address 10.0.13.2/30
   ip ospf network point-to-point
   ip ospf cost 40
!
router ospf 1
   router-id 3.3.3.3
   passive-interface Loopback0
   network 3.3.3.3/32 area 0.0.0.0
   network 10.0.23.0/30 area 0.0.0.0
   network 10.0.13.0/30 area 0.0.0.0
   max-lsa 12000
!
! Deliberate redaction bait (lab-only FAKE secret).
snmp-server community s3cr3tLabComm3 ro
!
end
