! IGP-migration rig startup-config — ceos1 (3-node triangle, OSPF area-0 brownfield baseline).
! This lab's baseline is OSPF — deliberately NO BGP and NO T6 telemetry seed. The pipeline's job
! in this arc is to DESIGN the OSPF→IS-IS migration against this harvested state; the brownfield
! "intent" the design must honor is carried in-band: per-link OSPF costs (asymmetric across links,
! symmetric per link), point-to-point network type on the /30s, passive Loopback0.
!
! NOTE: Management0 is intentionally NOT configured here — containerlab assigns the mgmt IP
! (172.30.31.11, from topology.clab.yml `mgmt-ipv4`) to Management0 automatically for arista_ceos.
!
hostname ceos1
!
! Lab credentials — STATIC (same honest WS4 non-conformance as the 2-node lab: static service
! credential, not the JWKS-forwarded per-user identity R2a mandates).
username admin privilege 15 role network-admin secret 0 paichartlab
!
! eAPI for read-only NAPALM/pyeapi harvest (nornir inventory pins http).
management api http-commands
   no shutdown
   protocol http
   protocol https
   !
   vrf default
      no shutdown
!
ip routing
!
! Router identity — advertised into OSPF; the IS-IS design derives NETs/system-IDs from these
! (the §7 `net`-leaf corpus: BCD-packing router-ID → NET).
interface Loopback0
   description router-id / migration anchor
   ip address 1.1.1.1/32
!
interface Ethernet1
   description to-ceos2 (ospf cost 10)
   no switchport
   ip address 10.0.12.1/30
   ip ospf network point-to-point
   ip ospf cost 10
!
interface Ethernet2
   description to-ceos3 (ospf cost 40 — transit path via ceos2 preferred: 10+20=30)
   no switchport
   ip address 10.0.13.1/30
   ip ospf network point-to-point
   ip ospf cost 40
!
! OSPF area 0 across the mesh, loopbacks advertised. Explicit interface costs above are the
! brownfield metric intent the IS-IS metricMap must translate (wide metrics).
router ospf 1
   router-id 1.1.1.1
   passive-interface Loopback0
   network 1.1.1.1/32 area 0.0.0.0
   network 10.0.12.0/30 area 0.0.0.0
   network 10.0.13.0/30 area 0.0.0.0
   max-lsa 12000
!
! Deliberate redaction bait (lab-only FAKE secret) — same R9/R10 exercise as the 2-node lab.
snmp-server community s3cr3tLabComm1 ro
!
end
