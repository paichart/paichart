---
arista_eos:
  platform: eos                 # NAPALM driver 'eos'; Netmiko maps to 'arista_eos'
  username: admin
  password: paichartlab         # matches the cEOS startup-config (static lab cred)
  connection_options:
    napalm:
      platform: eos
      extras:
        optional_args:
          # Pin plaintext eAPI over HTTP/80 to avoid the cEOS self-signed-TLS path.
          # (cEOS also has HTTPS enabled, so dropping these falls back to NAPALM's https default.)
          transport: http
          port: 80
    netmiko:
      platform: arista_eos      # only used by show_commands/apply_config — NOT declared in the descriptor
