---
# The two cEOS nodes, addressed by their containerlab mgmt IPs (topology.clab.yml `mgmt-ipv4`).
# nornir-mcp runs on the prod HOST, which can reach the clab-np bridge subnet (172.30.30.0/24) directly.
ceos1:
  hostname: 172.30.30.11
  platform: eos
  groups:
    - arista_eos
ceos2:
  hostname: 172.30.30.12
  platform: eos
  groups:
    - arista_eos
